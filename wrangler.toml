# Cloudflare Pages configuration.
#
# This project is a STATIC SITE + Pages Functions, deployed by the Cloudflare
# Pages *Git integration* (GitHub main -> npm install -> npm run build -> public/).
# It is not a Worker: there is no `main` entry point, and the only server-side
# code is functions/api/contact.js, which Pages compiles as a Pages Function.
#
# `name` MUST match the Cloudflare Pages project name exactly, or the Git build
# fails with a project-name mismatch.
#
# Secrets (RESEND_API_KEY, CLOUDFLARE_API_TOKEN, ...) never belong in this file.
# They live in the Cloudflare dashboard only. See DEPLOYMENT.md §4.

name = "dmgn"
pages_build_output_dir = "public"
compatibility_date = "2026-05-01"
