# Cloudflare Pages configuration.
#
# DMGN is a purely static HTML/CSS/JS website. There is no server-side runtime:
# no Worker, no Pages Functions, no API routes, no database. The build turns
# src/ into public/, and Cloudflare serves public/ as files.
#
# Deployment is the Pages Git integration (GitHub main -> npm install ->
# npm run build -> public/). No deploy command and no API token are involved.
#
# `name` MUST match the Cloudflare Pages project name exactly, or the Git build
# fails with a project-name mismatch.
#
# This file also keeps `npx wrangler pages dev public` and, as a break-glass
# path, `npx wrangler pages deploy public --project-name dmgn` working.

name = "dmgn"
pages_build_output_dir = "public"
compatibility_date = "2026-05-01"
